<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kart Royale - Sound Lab</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, 'Segoe UI', Arial, sans-serif; background: #0d1117; color: #e6edf3; }
    header { position: sticky; top: 0; z-index: 2; background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 20px; }
    header .hint { color: #8b949e; font-size: 13px; }
    main { padding: 16px 20px 60px; max-width: 1200px; margin: 0 auto; }
    h2 { margin: 28px 0 10px; font-size: 18px; color: #ffd166; border-bottom: 1px solid #30363d; padding-bottom: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    .card.played { border-color: #ffd166; }
    .row { display: flex; align-items: center; gap: 8px; }
    .id { font-weight: 700; color: #0d1117; background: #ffd166; border-radius: 6px; padding: 0 7px; font-size: 13px; }
    .name { font-weight: 700; flex: 1; }
    .what { color: #c9d1d9; }
    .when { color: #8b949e; font-size: 13px; }
    .code { color: #7ee787; font-size: 12px; font-family: Consolas, monospace; direction: ltr; text-align: left; }
    button { background: #238636; color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #2ea043; }
    button.off { background: #30363d; }
    button.big { padding: 10px 20px; font-size: 16px; }
    .live { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .live .ctl { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px 18px; margin-top: 8px; }
    .live label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c9d1d9; }
    .live input[type=range] { flex: 1; }
    .live output { min-width: 40px; color: #ffd166; font-family: Consolas, monospace; }
    audio { width: 100%; height: 34px; }
    #gate { position: fixed; inset: 0; z-index: 9; background: rgba(13,17,23,.92); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>
  <div id="gate">
    <h1>🔊 Sound Lab</h1>
    <div class="hint">הדפדפן דורש לחיצה כדי להפעיל קול</div>
    <button class="big" id="start">הפעל קול</button>
  </div>
  <header>
    <h1>🔊 Kart Royale - Sound Lab</h1>
    <span class="hint">כל צליל כאן נוצר במנוע הקול האמיתי של המשחק (src/audio/Audio.ts). המספר הצהוב = מזהה להחלפה.</span>
    <button class="off" id="stopAll">⏹ עצור הכל</button>
  </header>
  <main id="app"></main>
  <script type="module" src="/src/tools/SoundLab.ts"></script>
</body>
</html>
